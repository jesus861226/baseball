<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>김광림야구학교 취미반 보강수업 신청</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1b2a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="보강신청">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css" rel="stylesheet">
<style>
  :root {
    --navy: #0d1b2a;
    --navy2: #1b2d42;
    --navy3: #243447;
    --red: #e63946;
    --red2: #c1121f;
    --gold: #f4a261;
    --cream: #f1f0eb;
    --white: #ffffff;
    --gray: #8d99ae;
    --green: #2dc653;
    --green-bg: #0d3320;
    --full-red: #e63946;
    --full-bg: #3a0d12;
    --card-border: rgba(244,162,97,0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Paperlogy', sans-serif;
    background: var(--navy);
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ─── HEADER ─── */
  header {
    background: linear-gradient(135deg, #0d1b2a 0%, #1b2d42 60%, #16213e 100%);
    border-bottom: 3px solid var(--red);
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 32px rgba(230,57,70,0.18);
  }

  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .logo-ball {
    width: 48px; height: 48px;
    background: radial-gradient(circle at 35% 35%, #fff 0%, #e8e8e8 60%, #ccc 100%);
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  .logo-ball::before, .logo-ball::after {
    content: '';
    position: absolute;
    border: 2.5px solid var(--red);
    border-radius: 50%;
  }
  .logo-ball::before {
    width: 28px; height: 28px;
    top: -8px; left: 12px;
    transform: rotate(-30deg);
    clip-path: ellipse(14px 8px at 50% 50%);
    border-color: var(--red);
  }
  .logo-ball::after {
    width: 28px; height: 28px;
    bottom: -8px; right: 12px;
    transform: rotate(-30deg);
    clip-path: ellipse(14px 8px at 50% 50%);
  }

  .header-title h1 {
    font-family: 'Paperlogy', sans-serif;
    font-size: 1.35rem;
    color: var(--white);
    letter-spacing: 0.5px;
    line-height: 1.1;
    font-weight: 800;
  }
  .header-title span {
    font-family: 'Paperlogy', sans-serif;
    font-size: 0.92rem;
    color: var(--gold);
    font-weight: 600;
    letter-spacing: 1px;
  }

  /* 🆕 ─── 장소 공지 영역 ─── */
  .venue-notice {
    max-width: 1100px;
    margin: 20px auto 0;
    padding: 0 20px;
  }
  .venue-card {
    background: linear-gradient(145deg, rgba(244,162,97,0.08), rgba(244,162,97,0.02));
    border: 1.5px solid rgba(244,162,97,0.35);
    border-radius: 14px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.5s both;
  }
  .venue-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, var(--gold), var(--red));
  }
  .venue-card.changed {
    background: linear-gradient(145deg, rgba(45,198,83,0.10), rgba(45,198,83,0.02));
    border-color: rgba(45,198,83,0.45);
  }
  .venue-card.changed::before {
    background: linear-gradient(180deg, var(--green), #1a9c40);
  }
  .venue-emoji {
    font-size: 2rem;
    flex-shrink: 0;
  }
  .venue-info {
    flex: 1;
    min-width: 0;
  }
  .venue-label {
    font-size: 0.72rem;
    color: var(--gold);
    letter-spacing: 1px;
    font-weight: 700;
    margin-bottom: 3px;
    text-transform: uppercase;
  }
  .venue-card.changed .venue-label {
    color: var(--green);
  }
  .venue-place {
    font-size: 1.1rem;
    color: var(--white);
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  .venue-reason {
    font-size: 0.78rem;
    color: var(--gray);
    margin-top: 4px;
  }
  .venue-reason strong {
    color: var(--green);
    font-weight: 700;
  }
  /* 🆕 수업 시간표 영역 */
  .venue-schedule {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed rgba(244,162,97,0.25);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .venue-card.changed .venue-schedule {
    border-top-color: rgba(45,198,83,0.3);
  }
  .venue-schedule-item {
    font-size: 0.85rem;
    color: var(--cream);
    display: flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.3px;
  }
  .venue-schedule-item .sched-icon {
    color: var(--gold);
    flex-shrink: 0;
  }
  .venue-schedule-item .sched-class {
    color: var(--white);
    font-weight: 600;
    min-width: 0;
  }
  .venue-schedule-item .sched-dot {
    color: var(--gray);
  }
  .venue-schedule-item .sched-time {
    color: var(--gray);
    letter-spacing: 0.5px;
  }
  .venue-badge {
    background: rgba(45,198,83,0.18);
    color: var(--green);
    font-size: 0.68rem;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 12px;
    letter-spacing: 0.5px;
    border: 1px solid rgba(45,198,83,0.4);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ─── DATE PICKER ─── */
  .date-section {
    max-width: 1100px;
    margin: 32px auto 0;
    padding: 0 20px;
  }

  .date-section label {
    font-size: 0.8rem;
    color: var(--gold);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    display: block;
    margin-bottom: 10px;
  }

  .date-row {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  input[type="date"] {
    background: var(--navy2);
    border: 1.5px solid var(--card-border);
    border-radius: 10px;
    color: var(--white);
    font-size: 1rem;
    font-family: 'Paperlogy', sans-serif;
    padding: 10px 18px;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  input[type="date"]:focus { border-color: var(--gold); }

  .day-badge {
    background: var(--red);
    color: #fff;
    font-family: 'Paperlogy', sans-serif;
    font-size: 1rem;
    padding: 8px 18px;
    border-radius: 8px;
    display: none;
    letter-spacing: 2px;
  }

  /* ─── GRID ─── */
  .classes-grid {
    max-width: 1100px;
    margin: 28px auto 0;
    padding: 0 20px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 20px;
  }

  /* ─── CLASS CARD ─── */
  .class-card {
    background: linear-gradient(145deg, var(--navy2), var(--navy3));
    border: 1.5px solid var(--card-border);
    border-radius: 16px;
    padding: 24px;
    transition: transform 0.18s, box-shadow 0.18s;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.5s both;
  }
  .class-card:hover { transform: translateY(-3px); box-shadow: 0 8px 32px rgba(230,57,70,0.13); }

  .class-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, var(--gold), var(--red));
    border-radius: 4px 0 0 4px;
  }

  .class-card.full { border-color: rgba(230,57,70,0.35); }
  .class-card.full::before { background: var(--red); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }

  .class-name {
    font-family: 'Paperlogy', sans-serif;
    font-size: 1.15rem;
    color: var(--white);
    letter-spacing: 1px;
  }

  .class-time {
    font-size: 0.78rem;
    color: var(--gray);
    margin-top: 4px;
    letter-spacing: 1px;
  }

  .status-pill {
    padding: 5px 13px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .status-pill.open { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
  .status-pill.full { background: var(--full-bg); color: var(--full-red); border: 1px solid var(--full-red); }

  /* ─── SLOTS ─── */
  .slots-row {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .slot {
    flex: 1;
    height: 36px;
    border-radius: 8px;
    border: 1.5px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    font-weight: 500;
    transition: all 0.2s;
    overflow: hidden;
    padding: 0 4px;
  }
  .slot.taken {
    background: rgba(244,162,97,0.1);
    border-color: rgba(244,162,97,0.35);
    color: var(--gold);
    font-size: 0.68rem;
  }
  .slot.empty {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.2);
  }
  .slot.empty::after { content: '빈 자리'; font-size: 0.65rem; }

  .count-text {
    font-size: 0.78rem;
    color: var(--gray);
    margin-bottom: 14px;
  }
  .count-text strong { color: var(--gold); }

  /* ─── REGISTER FORM ─── */
  .reg-form {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .reg-hint {
    font-size: 0.72rem;
    color: var(--gray);
    text-align: center;
    margin-bottom: 4px;
    letter-spacing: 0.3px;
  }

  .name-input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    color: var(--white);
    font-family: 'Paperlogy', sans-serif;
    font-size: 0.9rem;
    padding: 9px 14px;
    outline: none;
    transition: border-color 0.2s;
    box-sizing: border-box;
  }
  .name-input:focus { border-color: var(--gold); }
  .name-input::placeholder { color: rgba(255,255,255,0.25); }
  .name-input:disabled { opacity: 0.4; cursor: not-allowed; }

  .reg-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--red), var(--red2));
    border: none;
    border-radius: 8px;
    color: #fff;
    font-family: 'Paperlogy', sans-serif;
    font-size: 0.95rem;
    padding: 11px 16px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: opacity 0.2s, transform 0.1s;
  }
  .reg-btn:hover:not(:disabled) { opacity: 0.88; transform: scale(0.98); }
  .reg-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .full-msg {
    text-align: center;
    color: var(--full-red);
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 10px 0 2px;
  }

  /* ─── 보강 미운영 카드 ─── */
  .class-card.no-makeup {
    border-color: rgba(255,193,7,0.35);
    background: linear-gradient(180deg, rgba(255,193,7,0.04) 0%, rgba(255,255,255,1) 60%);
  }
  .class-card.no-makeup::before {
    background: #f59e0b;
  }
  .status-pill.no-makeup-pill {
    background: rgba(255,193,7,0.12);
    color: #b45309;
    border: 1px solid rgba(245,158,11,0.5);
  }
  .no-makeup-msg {
    text-align: center;
    color: #92400e;
    font-size: 0.92rem;
    font-weight: 600;
    line-height: 1.55;
    padding: 18px 14px;
    margin-top: 12px;
    background: rgba(255,193,7,0.08);
    border: 1px dashed rgba(245,158,11,0.45);
    border-radius: 12px;
  }
  .no-makeup-msg strong {
    color: #b45309;
  }
  .no-makeup-msg small {
    display: inline-block;
    margin-top: 6px;
    font-size: 0.78rem;
    font-weight: 500;
    color: #78716c;
  }

  /* ─── TOAST ─── */
  #toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--navy2);
    border: 1.5px solid var(--gold);
    border-radius: 12px;
    padding: 14px 28px;
    color: var(--cream);
    font-size: 0.92rem;
    font-weight: 500;
    z-index: 999;
    transition: transform 0.35s cubic-bezier(.21,1.2,.5,1), opacity 0.3s;
    opacity: 0;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  #toast.error { border-color: var(--red); }

  /* ─── MODAL ─── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.show { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--navy2);
    border: 2px solid var(--gold);
    border-radius: 20px;
    padding: 36px 32px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    transform: scale(0.9);
    transition: transform 0.25s cubic-bezier(.21,1.2,.5,1);
  }
  .modal-overlay.show .modal { transform: scale(1); }

  .modal-icon { font-size: 3rem; margin-bottom: 16px; }
  .modal h2 { font-family: 'Paperlogy', sans-serif; font-size: 1.3rem; margin-bottom: 12px; color: var(--gold); }
  .modal p { font-size: 0.92rem; color: var(--gray); line-height: 1.7; margin-bottom: 24px; }
  .modal p strong { color: var(--white); }

  .modal-close {
    background: linear-gradient(135deg, var(--red), var(--red2));
    border: none; border-radius: 10px;
    color: #fff; font-family: 'Paperlogy', sans-serif;
    font-size: 1rem; padding: 12px 32px;
    cursor: pointer; letter-spacing: 1px;
    transition: opacity 0.2s;
  }
  .modal-close:hover { opacity: 0.85; }

  /* ─── LOADING ─── */
  .loading-screen {
    position: fixed; inset: 0;
    background: var(--navy);
    z-index: 300;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    transition: opacity 0.4s;
  }
  .loading-screen.hidden { opacity: 0; pointer-events: none; }

  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(244,162,97,0.2);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .loading-text { color: var(--gray); font-size: 0.88rem; letter-spacing: 2px; }

  /* ─── NOTICE ─── */
  .notice-bar {
    max-width: 1100px;
    margin: 0 auto;
    padding: 14px 20px 0;
    font-size: 0.8rem;
    color: var(--gray);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .notice-bar span { color: var(--gold); font-weight: 700; }

  /* ─── ADMIN SECTION ─── */
  /* ─── 🆕 비밀 관리자 아이콘 (야구공 푸터 라인) ─── */
  .admin-section {
    max-width: 1100px;
    margin: 40px auto 0;
    padding: 24px 20px 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    border-top: 1px solid rgba(244,162,97,0.08);
    flex-wrap: wrap;
  }
  .deco-ball {
    font-size: 16px;
    line-height: 1;
    opacity: 0.22;
    filter: grayscale(0.7);
    user-select: none;
  }
  .secret-icon {
    font-size: 16px;
    line-height: 1;
    opacity: 0.22;
    cursor: pointer;
    user-select: none;
    filter: grayscale(0.7);
    transition: opacity 0.2s, transform 0.2s, filter 0.2s;
  }
  .secret-icon:hover {
    opacity: 1;
    transform: scale(1.2);
    filter: grayscale(0);
  }
  .secret-icon:active {
    transform: scale(0.95);
  }

  /* ─── ANIMATIONS ─── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .class-card:nth-child(1) { animation-delay: 0.05s; }
  .class-card:nth-child(2) { animation-delay: 0.10s; }
  .class-card:nth-child(3) { animation-delay: 0.15s; }
  .class-card:nth-child(4) { animation-delay: 0.20s; }
  .class-card:nth-child(5) { animation-delay: 0.25s; }
  .class-card:nth-child(6) { animation-delay: 0.30s; }
  .class-card:nth-child(7) { animation-delay: 0.35s; }
  .class-card:nth-child(8) { animation-delay: 0.40s; }
  .class-card:nth-child(9) { animation-delay: 0.45s; }

  /* ─── CONFIG MODAL ─── */
  .config-modal {
    background: var(--navy2);
    border: 2px solid var(--gold);
    border-radius: 20px;
    padding: 32px 28px;
    max-width: 480px;
    width: 90%;
    transform: scale(0.9);
    transition: transform 0.25s cubic-bezier(.21,1.2,.5,1);
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal-overlay.show .config-modal { transform: scale(1); }

  .config-modal h2 {
    font-family: 'Paperlogy', sans-serif;
    font-size: 1.2rem;
    color: var(--gold);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  .config-subtitle { font-size: 0.78rem; color: var(--gray); margin-bottom: 20px; }

  .config-input-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    gap: 12px;
  }
  .config-input-row:last-of-type { border-bottom: none; }

  .config-label { font-size: 0.85rem; color: var(--cream); flex: 1; }
  .config-label small { display: block; font-size: 0.7rem; color: var(--gray); }

  .config-num {
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    color: var(--white);
    font-family: 'Paperlogy', sans-serif;
    font-size: 0.9rem;
    padding: 6px 10px;
    width: 60px;
    text-align: center;
    outline: none;
  }
  .config-num:focus { border-color: var(--gold); }

  .config-save-btn {
    width: 100%;
    margin-top: 20px;
    background: linear-gradient(135deg, var(--red), var(--red2));
    border: none; border-radius: 10px;
    color: #fff; font-family: 'Paperlogy', sans-serif;
    font-size: 1rem; padding: 13px;
    cursor: pointer; letter-spacing: 2px;
    transition: opacity 0.2s;
  }
  .config-save-btn:hover { opacity: 0.85; }

  .config-cancel-btn {
    width: 100%;
    margin-top: 10px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
    color: var(--gray); font-family: 'Paperlogy', sans-serif;
    font-size: 0.88rem; padding: 11px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .config-cancel-btn:hover { border-color: var(--gray); }

  /* 🆕 ─── 장소 공지 관리 모달 전용 ─── */
  .venue-form-group {
    margin-bottom: 18px;
  }
  .venue-form-label {
    display: block;
    font-size: 0.78rem;
    color: var(--gold);
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .venue-form-input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    color: var(--white);
    font-family: 'Paperlogy', sans-serif;
    font-size: 0.95rem;
    padding: 10px 14px;
    outline: none;
    box-sizing: border-box;
  }
  .venue-form-input:focus { border-color: var(--gold); }
  .venue-form-input::placeholder { color: rgba(255,255,255,0.25); }

  .venue-radio-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .venue-radio {
    display: flex;
    align-items: center;

<script>
// ============================================================
// 설정 - Google Apps Script 웹앱 URL
// ============================================================
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbybyCwV2sHoWvyT373JlCn7deqmrSDztZhdlOQtJU77CVhe7yk0vmk2QjN0AIt7In0wWQ/exec';

const CLASS_LIST = [
  { id: 'mon',        name: '월요반 (백현야구장 야외수업)', time: '17:30~19:00', day: '월', dayIndex: 1 },
  { id: 'tue',        name: '화요반',            time: '17:30~19:00', day: '화', dayIndex: 2 },
  { id: 'wed',        name: '수요반',            time: '17:30~19:00', day: '수', dayIndex: 3 },
  { id: 'thu',        name: '목요반 (백현야구장 야외수업)', time: '17:30~19:00', day: '목', dayIndex: 4 },
  { id: 'fri',        name: '금요반',            time: '18:40~20:10', day: '금', dayIndex: 5 },
  { id: 'sat_junior', name: '토요 주니어 중등반',  time: '10:00~12:00', day: '토', dayIndex: 6 },
  { id: 'sat_low',    name: '토요일 저학년반',    time: '13:30~15:00', day: '토', dayIndex: 6 },
  { id: 'sat_high',   name: '토요일 고학년반',    time: '15:00~16:30', day: '토', dayIndex: 6 },
  { id: 'sun',        name: '일요반 (백현야구장 야외수업)', time: '16:30~18:30', day: '일', dayIndex: 0, noMakeup: true },
];

const DAY_NAMES = ['일','월','화','수','목','금','토'];

// Local state
let localData = {};
let localCapacity = {};
CLASS_LIST.forEach(c => localCapacity[c.id] = 3);

let selectedDate = '';
let selectedClassId = null;
let isOnline = false;

// 🆕 장소 공지 캐시
let venueNoticesCache = [];

// ============================================================
// 프리페치 캐시 (로딩 속도 개선)
// ============================================================
const prefetchCache = {};
const CACHE_TTL = 30000;

async function prefetchStatus(date) {
  if (prefetchCache[date] && Date.now() - prefetchCache[date].timestamp < CACHE_TTL) return;
  try {
    const res = await apiGet('getStatus', { date });
    if (res.success) {
      prefetchCache[date] = { data: res.data, timestamp: Date.now() };
      res.data.forEach(c => { localCapacity[c.id] = c.maxCapacity; });
    }
  } catch(e) {}
}

function prefetchNearDates(baseDate) {
  const base = new Date(baseDate + 'T00:00:00');
  for (let i = 0; i <= 7; i++) {
    const d = new Date(base);
    d.setDate(base.getDate() + i);
    const str = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    setTimeout(() => prefetchStatus(str), i * 300);
  }
}

// ============================================================
// 날짜 유틸
// ============================================================
function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getDayIndex(dateStr) {
  return new Date(dateStr + 'T00:00:00').getDay();
}

function getDayName(dateStr) {
  return DAY_NAMES[getDayIndex(dateStr)];
}

function isMatchingDay(dateStr, classId) {
  const cls = CLASS_LIST.find(c => c.id === classId);
  if (!cls) return false;
  return getDayIndex(dateStr) === cls.dayIndex;
}

function getNearestDate(classId) {
  const cls = CLASS_LIST.find(c => c.id === classId);
  if (!cls) return getTodayStr();
  const today = new Date();
  today.setHours(0,0,0,0);
  const todayDay = today.getDay();
  let diff = cls.dayIndex - todayDay;
  if (diff < 0) diff += 7;
  if (diff === 0) diff = 7;
  const target = new Date(today);
  target.setDate(today.getDate() + diff);
  return `${target.getFullYear()}-${String(target.getMonth()+1).padStart(2,'0')}-${String(target.getDate()).padStart(2,'0')}`;
}

// ============================================================
// API 호출
// ============================================================
async function apiGet(action, params = {}) {
  const query = new URLSearchParams({ action, ...params }).toString();
  const url = `${APPS_SCRIPT_URL}?${query}`;
  const res = await fetch(url);
  return await res.json();
}

// ============================================================
// 🆕 장소 공지 관련 함수
// ============================================================
function getDefaultVenueByDate(dateStr) {
  const dayIdx = getDayIndex(dateStr);
  // 월(1), 목(4), 일(0) → 야외, 그 외 → 실내
  if (dayIdx === 0 || dayIdx === 1 || dayIdx === 4) {
    return { type: 'outdoor', label: '백현야구장 (야외)', emoji: '⚾' };
  }
  return { type: 'indoor', label: '야구학교 (실내)', emoji: '🏠' };
}

function getVenueForDate(dateStr) {
  const notice = venueNoticesCache.find(n => n.date === dateStr);
  const defaultVenue = getDefaultVenueByDate(dateStr);

  if (notice) {
    const noticeLabel = notice.venue === 'outdoor'
      ? { label: '백현야구장 (야외)', emoji: '⚾' }
      : { label: '야구학교 (실내)', emoji: '🏠' };
    const isChanged = notice.venue !== defaultVenue.type;
    return {
      ...noticeLabel,
      type: notice.venue,
      isChanged,
      reason: notice.reason || '',
      defaultLabel: defaultVenue.label
    };
  }
  return { ...defaultVenue, isChanged: false, reason: '' };
}

async function loadVenueNotices() {
  try {
    const res = await apiGet('getVenueNotices');
    if (res && res.success) {
      venueNoticesCache = res.data || [];
    }
  } catch(e) {
    venueNoticesCache = [];
  }
  renderTodayVenue();
}

function renderTodayVenue() {
  const container = document.getElementById('venueNotice');
  if (!container) return;

  const today = getTodayStr();
  const info = getVenueForDate(today);
  const dayName = getDayName(today);
  const md = today.slice(5).replace('-', '/');
  const todayDayIdx = getDayIndex(today);

  // 🆕 오늘 요일에 해당하는 모든 반의 시간표 생성
  const todayClasses = CLASS_LIST.filter(c => c.dayIndex === todayDayIdx);
  const scheduleHtml = todayClasses.length > 0
    ? `
      <div class="venue-schedule">
        ${todayClasses.map(c => {
          // 반 이름에서 "(백현야구장 야외수업)" 같은 부가 설명 제거 → 간결하게
          const cleanName = c.name.replace(/\s*\(.*?\)\s*/g, '').trim();
          return `
            <div class="venue-schedule-item">
              <span class="sched-icon">⏰</span>
              <span class="sched-class">${cleanName}</span>
              <span class="sched-dot">·</span>
              <span class="sched-time">${c.time}</span>
            </div>
          `;
        }).join('')}
      </div>
    `
    : '';

  container.innerHTML = `
    <div class="venue-card ${info.isChanged ? 'changed' : ''}">
      <div class="venue-emoji">${info.emoji}</div>
      <div class="venue-info">
        <div class="venue-label">${info.isChanged ? '오늘 변경된 수업 장소' : '오늘 수업 장소'} · ${md} (${dayName})</div>
        <div class="venue-place">${info.label}</div>
        ${info.isChanged ? `
          <div class="venue-reason">
            <strong>기본 장소:</strong> ${info.defaultLabel}
            ${info.reason ? ` · 사유: ${info.reason}` : ''}
          </div>
        ` : ''}
        ${scheduleHtml}
      </div>
      ${info.isChanged ? '<div class="venue-badge">변경됨</div>' : ''}
    </div>
  `;
}

// ============================================================
// 🆕 관리자 - 장소 공지 등록/수정/삭제
// ============================================================
async function openVenueAdmin() {
  document.getElementById('venueAdminDate').value = getTodayStr();
  document.getElementById('venueAdminReason').value = '';
  document.querySelectorAll('input[name="venueChoice"]').forEach(r => r.checked = false);

  await loadVenueNotices();
  renderVenueAdminList();

  document.getElementById('venueAdminModal').classList.add('show');
}

function renderVenueAdminList() {
  const listEl = document.getElementById('venueAdminList');
  if (!listEl) return;

  const today = getTodayStr();
  const upcoming = venueNoticesCache
    .filter(n => n.date >= today)
    .sort((a, b) => a.date.localeCompare(b.date));

  if (upcoming.length === 0) {
    listEl.innerHTML = `<div class="venue-admin-empty">등록된 공지가 없습니다.</div>`;
    return;
  }

  listEl.innerHTML = upcoming.map(n => {
    const dt = new Date(n.date + 'T00:00:00');
    const dayName = DAY_NAMES[dt.getDay()];
    const md = n.date.slice(5).replace('-','/');
    const venueLabel = n.venue === 'outdoor' ? '⚾ 야외' : '🏠 실내';
    return `
      <div class="venue-admin-item">
        <div class="venue-admin-item-info">
          <span class="venue-admin-item-date">${md}(${dayName})</span>
          <span class="venue-admin-item-place">${venueLabel}</span>
          ${n.reason ? `<span class="venue-admin-item-reason">📝 ${n.reason}</span>` : ''}
        </div>
        <button class="venue-admin-delete" onclick="deleteVenueNotice('${n.date}')">삭제</button>
      </div>
    `;
  }).join('');
}

async function saveVenueNotice() {
  const date = document.getElementById('venueAdminDate').value;
  const venue = document.querySelector('input[name="venueChoice"]:checked')?.value;
  const reason = document.getElementById('venueAdminReason').value.trim();

  if (!date) { showToast('날짜를 선택해주세요.', true); return; }
  if (!venue) { showToast('장소를 선택해주세요.', true); return; }

  const saveBtn = document.querySelector('#venueAdminModal .config-save-btn');
  saveBtn.textContent = '저장 중...';
  saveBtn.disabled = true;

  try {
    const res = await apiGet('saveVenueNotice', { date, venue, reason });
    if (res.success) {
      showToast('✅ 공지가 등록되었습니다.');
      await loadVenueNotices();
      renderVenueAdminList();
      // 폼 초기화
      document.querySelectorAll('input[name="venueChoice"]').forEach(r => r.checked = false);
      document.getElementById('venueAdminReason').value = '';
    } else {
      showToast(res.message || '등록 실패', true);
    }
  } catch(e) {
    showToast('서버 연결 실패. 다시 시도해주세요.', true);
  } finally {
    saveBtn.textContent = '공지 등록';
    saveBtn.disabled = false;
  }
}

async function deleteVenueNotice(date) {
  if (!confirm(`${date} 공지를 삭제하시겠습니까?`)) return;

  try {
    const res = await apiGet('deleteVenueNotice', { date });
    if (res.success) {
      showToast('✅ 공지가 삭제되었습니다.');
      await loadVenueNotices();
      renderVenueAdminList();
    } else {
      showToast(res.message || '삭제 실패', true);
    }
  } catch(e) {
    showToast('서버 연결 실패.', true);
  }
}

// ============================================================
// STEP 1: 반 선택 버튼 렌더링
// ============================================================
function renderClassSelectGrid() {
  const grid = document.getElementById('classSelectGrid');
  grid.innerHTML = CLASS_LIST.map((cls, i) => `
    <button class="class-select-btn ${selectedClassId === cls.id ? 'active' : ''}"
            onclick="selectClass('${cls.id}')"
            style="animation-delay:${i*0.05}s">
      <div class="check-icon">✓</div>
      <div class="btn-day">${cls.day}요일 · ${cls.name}</div>
      <div class="btn-name">${cls.name}</div>
      <div class="btn-time">⏰ ${cls.time}</div>
    </button>
  `).join('');
}

function selectClass(classId) {
  selectedClassId = classId;

  document.querySelectorAll('.class-select-btn').forEach(btn => btn.classList.remove('active'));
  event.currentTarget.classList.add('active');

  updateDateHint(selectedDate, classId);

  document.getElementById('classesGrid').style.display = 'grid';
  document.getElementById('noticeBar').style.display = 'flex';
  loadStatus(selectedDate, classId);

  setTimeout(() => {
    document.getElementById('classesGrid').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 100);
}

function resetClassSelect() {
  selectedClassId = null;
  document.querySelectorAll('.class-select-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById('classesGrid').style.display = 'none';
  document.getElementById('noticeBar').style.display = 'none';
  document.getElementById('dateHint').textContent = '';
  document.getElementById('dateHint').className = 'date-hint';
}

function updateDayBadge(dateStr) {
  if (!dateStr) return;
  const badge = document.getElementById('dayBadge');
  badge.textContent = getDayName(dateStr) + '요일';
  badge.style.display = 'block';
}

function updateDateHint(dateStr, classId) {
  const hint = document.getElementById('dateHint');
  if (!dateStr || !classId) { hint.textContent = ''; return; }
  const cls = CLASS_LIST.find(c => c.id === classId);
  if (isMatchingDay(dateStr, classId)) {
    hint.textContent = `✅ ${getDayName(dateStr)}요일 — ${cls.name} 수업일과 일치합니다.`;
    hint.className = 'date-hint ok';
  } else {
    hint.textContent = `⚠ 선택한 날짜(${getDayName(dateStr)}요일)는 ${cls.name}(${cls.day}요일) 수업일이 아닙니다. 보강 신청은 가능하지만 확인하세요.`;
    hint.className = 'date-hint warn';
  }
}

async function loadStatus(date, classId) {
  showLoading(true);
  let allClasses;

  if (APPS_SCRIPT_URL !== 'YOUR_APPS_SCRIPT_WEB_APP_URL') {
    try {
      const cached = prefetchCache[date];
      if (cached && Date.now() - cached.timestamp < CACHE_TTL) {
        allClasses = cached.data;
        allClasses.forEach(c => { localCapacity[c.id] = c.maxCapacity; });
        isOnline = true;
        document.getElementById('offlineBanner').style.display = 'none';
      } else {
        const res = await apiGet('getStatus', { date });
        if (res.success) {
          allClasses = res.data;
          allClasses.forEach(c => { localCapacity[c.id] = c.maxCapacity; });
          prefetchCache[date] = { data: res.data, timestamp: Date.now() };
          isOnline = true;
          document.getElementById('offlineBanner').style.display = 'none';
        } else throw new Error(res.message);
      }
    } catch(e) {
      isOnline = false;
      allClasses = buildLocalStatus(date);
      document.getElementById('offlineBanner').style.display = 'block';
    }
  } else {
    isOnline = false;
    allClasses = buildLocalStatus(date);
    document.getElementById('offlineBanner').style.display = 'block';
  }

  const cls = CLASS_LIST.find(c => c.id === classId);
  const filtered = cls
    ? allClasses.filter(c => c.id === classId || CLASS_LIST.find(x => x.id === c.id)?.dayIndex === cls.dayIndex)
    : allClasses;

  renderClasses(filtered, date, classId);
  showLoading(false);
}

function buildLocalStatus(date) {
  return CLASS_LIST.map(c => {
    const key = `${c.id}|${date}`;
    const students = localData[key] || [];
    const max = localCapacity[c.id] ?? 3;
    return {
      id: c.id, name: c.name, time: c.time, day: c.day,
      maxCapacity: max, currentCount: students.length,
      available: max - students.length,
      isFull: students.length >= max,
      students: [...students]
    };
  });
}

function renderClasses(classes, date, activeClassId) {
  const grid = document.getElementById('classesGrid');
  grid.innerHTML = '';

  classes.forEach((cls, i) => {
    const isSelected = cls.id === activeClassId;
    const classMeta = CLASS_LIST.find(c => c.id === cls.id);
    const isNoMakeup = classMeta?.noMakeup === true;

    const card = document.createElement('div');
    card.className = `class-card ${cls.isFull ? 'full' : ''} ${isSelected ? 'selected-class' : ''} ${isNoMakeup ? 'no-makeup' : ''}`;
    card.style.animationDelay = `${i * 0.07}s`;

    if (isNoMakeup) {
      const selectedMark = isSelected ? `<div class="my-class-tag">보강 신청할 수업반</div>` : '';
      card.innerHTML = `
        ${selectedMark}
        <div class="card-top">
          <div>
            <div class="class-name">${cls.name}</div>
            <div class="class-time">⏰ ${cls.time}</div>
          </div>
          <div class="status-pill no-makeup-pill">보강 미운영</div>
        </div>
        <div class="no-makeup-msg">
          ⚠️ 일요반은 <strong>타반 학생의 보강 신청을 받지 않습니다.</strong><br>
          <small>일요반 학생의 결석 시 보강은 평일반에서 가능합니다.</small>
        </div>
      `;
      grid.appendChild(card);
      return;
    }

    let slotsHtml = '';
    for (let s = 0; s < cls.maxCapacity; s++) {
      if (s < cls.students.length) {
        const name = cls.students[s] || '';
        const display = name.length > 5 ? name.slice(0,4)+'…' : name;
        slotsHtml += `<div class="slot taken" title="${name}">${display}</div>`;
      } else {
        slotsHtml += `<div class="slot empty"></div>`;
      }
    }

    const statusHtml = cls.isFull
      ? `<div class="status-pill full">마감</div>`
      : `<div class="status-pill open">신청가능 ${cls.available}석</div>`;

    const inputHtml = cls.isFull
      ? `<div class="full-msg">🔴 보강 자리가 모두 찼습니다</div>`
      : `<div class="reg-form">
           <div class="reg-hint">💡 빈자리 클릭 없이 이름만 입력하시면 자동 배정됩니다</div>
           <input type="text" class="name-input" id="name_${cls.id}" placeholder="학생 이름 입력" maxlength="10">
           <button class="reg-btn" onclick="doRegister('${cls.id}','${date}')">신청</button>
         </div>`;

    const selectedMark = isSelected ? `<div class="my-class-tag">보강 신청할 수업반</div>` : '';

    card.innerHTML = `
      ${selectedMark}
      <div class="card-top">
        <div>
          <div class="class-name">${cls.name}</div>
          <div class="class-time">⏰ ${cls.time}</div>
        </div>
        ${statusHtml}
      </div>
      <div class="slots-row">${slotsHtml}</div>
      <div class="count-text"><strong>${cls.currentCount}</strong> / ${cls.maxCapacity}명 신청됨</div>
      ${inputHtml}
    `;
    grid.appendChild(card);
  });

  if (classes.length > 1) {
    const infoEl = document.createElement('div');
    infoEl.className = 'same-day-info';
    infoEl.innerHTML = `💡 같은 요일의 다른 반도 함께 표시됩니다.`;
    grid.insertBefore(infoEl, grid.firstChild);
  }
}

async function doRegister(classId, date) {
  const classMeta = CLASS_LIST.find(c => c.id === classId);
  if (classMeta?.noMakeup) {
    showToast('해당 반은 보강 신청을 받지 않습니다.', true);
    return;
  }

  const input = document.getElementById(`name_${classId}`);
  const studentName = input.value.trim();
  if (!studentName) { showToast('학생 이름을 입력해주세요.', true); input.focus(); return; }
  if (!date) { showToast('날짜를 먼저 선택해주세요.', true); return; }

  input.disabled = true;
  let result;

  if (isOnline) {
    try { result = await apiGet('register', { classId, studentName, date }); }
    catch(e) { result = { success: false, message: '서버 연결 실패. 잠시 후 다시 시도하세요.' }; }
  } else {
    const key = `${classId}|${date}`;
    const students = localData[key] || [];
    const max = localCapacity[classId] ?? 3;
    if (students.length >= max) {
      result = { success: false, message: '보강 자리가 모두 찼습니다.' };
    } else if (students.includes(studentName)) {
      result = { success: false, message: '이미 신청된 학생입니다.' };
    } else {
      if (!localData[key]) localData[key] = [];
      localData[key].push(studentName);
      const cls = CLASS_LIST.find(c => c.id === classId);
      result = { success: true, data: { className: cls.name, studentName, date, time: cls.time } };
    }
  }

  input.disabled = false;
  input.value = '';

  if (result.success) {
    const d = result.data;
    delete prefetchCache[date];
    document.getElementById('modalTitle').textContent = '신청 완료! ⚾';
    document.getElementById('modalBody').innerHTML =
      `<strong>${d.studentName}</strong> 학생의<br><strong>${d.className}</strong> 보강 신청이 완료되었습니다.<br><br>📅 날짜: ${d.date}<br>⏰ 시간: ${d.time}`;
    openModal('successModal');
    await loadStatus(date, selectedClassId);
  } else {
    showToast(result.message, true);
  }
}

async function openAdminConfig() {
  const rows = document.getElementById('configRows');
  rows.innerHTML = `<div style="text-align:center;padding:20px;color:var(--gold)">⏳ 서버에서 설정 불러오는 중...</div>`;
  openModal('adminModal');

  try {
    const res = await apiGet('getCapacity');
    if (res.success) {
      Object.assign(localCapacity, res.data);
    }
  } catch(e) {}

  rows.innerHTML = CLASS_LIST.map(c => `
    <div class="config-input-row">
      <div class="config-label">${c.name}<small>${c.time}</small></div>
      <input type="number" class="config-num" id="cap_${c.id}" value="${localCapacity[c.id] ?? 3}" min="0" max="20">
    </div>
  `).join('');
}

async function saveConfig() {
  const capacityMap = {};
  CLASS_LIST.forEach(c => {
    const val = parseInt(document.getElementById(`cap_${c.id}`).value);
    // 빈 값/NaN/음수면 기본값 3, 0 이상은 그대로 (0도 유효 - 보강 미운영)
    capacityMap[c.id] = (isNaN(val) || val < 0) ? 3 : val;
    localCapacity[c.id] = capacityMap[c.id];
  });

  const saveBtn = document.querySelector('#adminModal .config-save-btn');
  saveBtn.textContent = '저장 중...';
  saveBtn.disabled = true;

  try {
    const res = await apiGet('updateCapacity', { capacityMap: JSON.stringify(capacityMap) });
    closeModal('adminModal');
    showToast(res.success ? '✅ 설정이 서버에 저장되었습니다.' : '⚠️ 저장 실패: ' + res.message, !res.success);
  } catch(e) {
    closeModal('adminModal');
    showToast('⚠️ 서버 저장 실패. 로컬에만 적용됩니다.', true);
  } finally {
    saveBtn.textContent = '저장';
    saveBtn.disabled = false;
  }

  if (selectedDate && selectedClassId) await loadStatus(selectedDate, selectedClassId);
}

function showLoading(v) {
  const el = document.getElementById('loadingScreen');
  if (v) el.classList.remove('hidden');
  else setTimeout(() => el.classList.add('hidden'), 300);
}
function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

let toastTimer;
function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.className = '', 3200);
}

// ============================================================
// 초기화
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  renderClassSelectGrid();

  const dp = document.getElementById('datePicker');
  const today = getTodayStr();
  dp.value = today;
  selectedDate = today;
  updateDayBadge(today);
  showLoading(false);

  // 🆕 페이지 로드 시 오늘 수업 장소 표시
  loadVenueNotices();

  if (APPS_SCRIPT_URL !== 'YOUR_APPS_SCRIPT_WEB_APP_URL') {
    setTimeout(() => prefetchNearDates(today), 500);
  }

  dp.addEventListener('change', async () => {
    selectedDate = dp.value;
    updateDayBadge(selectedDate);
    updateDateHint(selectedDate, selectedClassId);
    prefetchNearDates(selectedDate);
    if (selectedClassId) await loadStatus(selectedDate, selectedClassId);
  });

  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => {
      if (e.target === overlay) overlay.classList.remove('show');
    });
  });
});
